<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page has no network access: all networking and signing happen in Python. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<title>OpenCustody</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Logo: an open padlock with a spark where the shackle is released -->
<svg width="0" height="0" class="sprite">
  <defs>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="logo" viewBox="0 0 100 100">
      <circle cx="67" cy="40" r="8" fill="url(#sparkGlow)"/>
      <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="2.2">
          <path d="M73.5 33.5 L76 31"/><path d="M75 40 H78.5"/><path d="M73.5 46.5 L76 49"/>
        </g>
        <path d="M37 48 V33 A13.5 13.5 0 0 1 64 33 V35.5" stroke-width="4"/>
        <rect x="26" y="48" width="48" height="34" rx="9" stroke-width="4"/>
        <circle cx="50" cy="61.5" r="4.2" stroke-width="3"/>
        <path d="M50 65.7 V71.5" stroke-width="3"/>
      </g>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-pie" viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-file"viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></symbol>
  </defs>
</svg>

<!-- Onboarding / unlock -->
<div class="onboard" id="onboard">
  <canvas id="flow"></canvas>
  <section class="hero" id="hero"></section>
</div>

<!-- Wallet -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo logo-glow"><use href="#logo"/></svg>
      <div class="brand-name">OPENCUSTODY <span>WALLET</span></div>
    </div>
    <div class="side-pad">
      <button class="btn-new pf-btn" id="pfBtn" title="Switch portfolio"><span class="dot"></span><span class="pf-meta"><small>Portfolio</small><span id="pfName">Main</span></span><svg class="i chev"><use href="#i-chev"/></svg></button>
      <nav class="side-nav">
        <button class="side-link" id="navHome"><svg class="i"><use href="#i-pie"/></svg>Home<kbd>Ctrl H</kbd></button>
        <button class="side-link" id="navHistory"><svg class="i"><use href="#i-clock"/></svg>History<kbd>Ctrl Y</kbd></button>
      </nav>
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="acctSearch" placeholder="Search assets…" autocomplete="off" spellcheck="false"></label>
    </div>
    <nav class="history" id="accts"></nav>
    <div class="dropdown" id="pfDD"></div>
    <div class="side-foot">
      <button class="side-link" id="settingsBtn"><svg class="i"><use href="#i-gear"/></svg>Settings</button>
      <button class="side-link" id="lockBtn"><svg class="i"><use href="#i-lock"/></svg>Lock wallet<kbd>Ctrl L</kbd></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSide" title="Toggle sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <div class="net-title"><span class="dot"></span><span id="netTitle">Wallet</span></div>
      <div class="spacer"></div>
      <span class="pill">Mainnet</span>
      <span class="pill">Self-custody</span>
      <button class="icon-btn" id="topRefresh" title="Refresh balances (Ctrl R)"><svg class="i"><use href="#i-refresh"/></svg></button>
      <button class="hist-btn" id="topHistory" title="Recent transactions (Ctrl Y)"><svg class="i"><use href="#i-clock"/></svg>History</button>
    </header>
    <div class="scroller"><div class="view" id="view"></div></div>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
