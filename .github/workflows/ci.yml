name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch newly published CVEs in pinned deps

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          OPENCUSTODY_HOME: ${{ runner.temp }}/oc

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Bandit (static analysis)
        run: bandit -r src -c pyproject.toml
      - name: pip-audit (known CVEs)
        # PYSEC-2026-1325: python-ecdsa P-256 timing leak, no upstream fix, never used for
        # signing here (see SECURITY.md and test_secp256k1_uses_libsecp256k1).
        run: pip-audit --ignore-vuln PYSEC-2026-1325

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
